<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartsX 🎯</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:white;
}

.app{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    padding:20px;
}

h1{
    font-size:42px;
    margin:15px 0 5px;
}

h2{
    margin-top:5px;
}

.subtitle{
    color:#9ca7b8;
    margin-bottom:25px;
}

.card{
    background:#171d27;
    border-radius:20px;
    padding:20px;
    margin:15px 0;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin:6px 0;
    background:#293241;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.primary{
    background:white;
    color:#111;
}

.danger{
    background:#713b43;
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #3a4352;
    background:#0e131b;
    color:white;
    margin:6px 0;
    font-size:16px;
}

.hidden{
    display:none;
}

.score{
    font-size:72px;
    text-align:center;
    font-weight:900;
    margin:15px 0;
}

.player-name{
    text-align:center;
    color:#aeb8c8;
    font-size:18px;
}

.dart-counter{
    text-align:center;
    color:#aeb8c8;
}

.number-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.number-grid button{
    padding:13px 4px;
    margin:0;
}

.bull{
    background:#596b83 !important;
}

.special{
    background:#38475c;
}

.turn-darts{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.dart{
    background:#293241;
    padding:10px 15px;
    border-radius:10px;
}

.rank-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 5px;
    border-bottom:1px solid #303947;
}

.rank-position{
    font-weight:bold;
}

.rank-average{
    font-weight:bold;
}

.stat{
    background:#202734;
    padding:15px;
    border-radius:13px;
    margin:8px 0;
    display:flex;
    justify-content:space-between;
}

.bot{
    background:#202734;
    padding:12px;
    border-radius:12px;
    margin:7px 0;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.small{
    font-size:13px;
    color:#9ca7b8;
}

.back{
    background:transparent;
    text-align:left;
    padding:5px 0;
    width:auto;
}

.success{
    color:#69db7c;
}

.warning{
    color:#ffd166;
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script>

/* =====================================================
   DATOS
===================================================== */

const STORAGE_KEY = "DARTSX_DATA";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    users: {},
    currentUser: null
};

let game = null;

let selectedBots = [];

let multiplier = 1;


/* =====================================================
   GUARDAR
===================================================== */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   PANTALLA DE INICIO DE SESIÓN
===================================================== */

function showLogin(){

    document.getElementById("app").innerHTML = `

        <h1>DartsX 🎯</h1>

        <p class="subtitle">
            Tu marcador de dardos
        </p>

        <div class="card">

            <h2>Iniciar sesión</h2>

            <input
                id="loginName"
                placeholder="Nombre de jugador"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Iniciar sesión
            </button>

        </div>

        <div class="card">

            <h2>Crear cuenta</h2>

            <input
                id="registerName"
                placeholder="Nuevo nombre"
            >

            <button
                onclick="register()"
            >
                Registrarse
            </button>

        </div>

    `;

}


/* =====================================================
   REGISTRARSE
===================================================== */

function register(){

    let name =
        document.getElementById("registerName")
        .value
        .trim();

    if(!name){

        alert("Escribe un nombre.");

        return;
    }

    if(data.users[name]){

        alert("Ese jugador ya existe.");

        return;
    }

    data.users[name] = {

        totalPoints:0,

        totalDarts:0,

        matches:0,

        wins:0

    };

    data.currentUser = name;

    saveData();

    showHome();

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    let name =
        document.getElementById("loginName")
        .value
        .trim();

    if(!name){

        alert("Escribe tu nombre.");

        return;
    }

    if(!data.users[name]){

        alert("No existe esa cuenta. Regístrate primero.");

        return;
    }

    data.currentUser = name;

    saveData();

    showHome();

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

    let user = data.currentUser;

    document.getElementById("app").innerHTML = `

        <h1>DartsX 🎯</h1>

        <p class="subtitle">
            Hola, ${escapeHTML(user)}
        </p>

        <button
            class="primary"
            onclick="showGameSetup()"
        >
            🎯 Nueva partida
        </button>

        <button onclick="showAccount()">
            👤 Mi cuenta
        </button>

        <button onclick="showRanking()">
            🏆 Ranking
        </button>

        <button
            class="danger"
            onclick="logout()"
        >
            Cerrar sesión
        </button>

    `;

}


/* =====================================================
   CONFIGURAR PARTIDA
===================================================== */

function showGameSetup(){

    selectedBots = [];

    document.getElementById("app").innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>Nueva partida</h1>

        <div class="card">

            <h2>Modo de juego</h2>

            <button
                class="primary"
                onclick="start501()"
            >
                🎯 501
            </button>

            <button
                onclick="alert('El modo Cricket estará disponible próximamente.')"
            >
                🎯 Cricket
            </button>

        </div>

        <div class="card">

            <h2>Jugadores</h2>

            <p>
                👤 ${escapeHTML(data.currentUser)}
                <span class="success"> Tú</span>
            </p>

            <button onclick="addBot()">
                + Añadir bot
            </button>

            <div id="botsList"></div>

        </div>

        <button
            class="primary"
            onclick="start501()"
        >
            Empezar partida
        </button>

    `;

}


/* =====================================================
   AÑADIR BOT
===================================================== */

function addBot(){

    if(selectedBots.length >= 3){

        alert("Puedes añadir hasta 3 bots.");

        return;
    }

    let level =
        selectedBots.length + 1;

    selectedBots.push(level);

    updateBots();

}


/* =====================================================
   MOSTRAR BOTS
===================================================== */

function updateBots(){

    let html = "";

    selectedBots.forEach(function(level,index){

        html += `

            <div class="bot">

                🤖 Bot ${index + 1}

                <br>

                <span class="small">
                    Nivel ${level} / 10
                </span>

            </div>

        `;

    });

    document.getElementById("botsList").innerHTML = html;

}


/* =====================================================
   EMPEZAR 501
===================================================== */

function start501(){

    let players = [];

    players.push({

        name:data.currentUser,

        score:501,

        darts:0,

        pointsScored:0,

        isBot:false,

        level:10

    });


    selectedBots.forEach(function(level){

        players.push({

            name:"Bot nivel " + level,

            score:501,

            darts:0,

            pointsScored:0,

            isBot:true,

            level:level

        });

    });


    game = {

        players:players,

        current:0,

        turnDarts:[],

        turnPoints:0

    };

    multiplier = 1;

    renderGame();

}


/* =====================================================
   MOSTRAR PARTIDA
===================================================== */

function renderGame(){

    let player =
        game.players[game.current];

    document.getElementById("app").innerHTML = `

        <div class="top">

            <button
                class="back"
                onclick="leaveGame()"
            >
                ← Salir
            </button>

            <span class="small">
                ${game.current + 1}/${game.players.length}
            </span>

        </div>

        <div class="card">

            <div class="player-name">
                ${escapeHTML(player.name)}
            </div>

            <div class="score">
                ${player.score}
            </div>

            <div class="dart-counter">

                Dardos del turno:
                ${game.turnDarts.length}/3

            </div>

        </div>

        <div class="card">

            <h3>Turno actual</h3>

            <div class="turn-darts">

                ${
                    game.turnDarts.length === 0

                    ?

                    "<span class='small'>Todavía no has lanzado.</span>"

                    :

                    game.turnDarts.map(function(d){

                        return `
                            <span class="dart">
                                ${d}
                            </span>
                        `;

                    }).join("")

                }

            </div>

        </div>

        <div class="card">

            <h3>Puntuación</h3>

            <div class="number-grid">

                ${generateNumbers()}

                <button
                    class="bull"
                    onclick="throwDart(25,'BULL')"
                >
                    BULL<br>
                    25
                </button>

                <button
                    class="bull"
                    onclick="throwDart(50,'DOBLE BULL')"
                >
                    DOBLE BULL<br>
                    50
                </button>

                <button
                    class="special"
                    onclick="selectMultiplier(2)"
                >
                    DOBLE
                </button>

                <button
                    class="special"
                    onclick="selectMultiplier(3)"
                >
                    TRIPLE
                </button>

                <button
                    onclick="throwDart(0,'MISS')"
                >
                    MISS
                </button>

            </div>

        </div>

        <div class="card">

            <button
                onclick="finishTurn()"
            >
                Terminar turno
            </button>

        </div>

    `;

}


/* =====================================================
   GENERAR NÚMEROS
===================================================== */

function generateNumbers(){

    let html = "";

    for(let i=1;i<=20;i++){

        html += `

            <button
                onclick="throwDart(${i},'${i}')"
            >
                ${i}
            </button>

        `;

    }

    return html;

}


/* =====================================================
   MULTIPLICADOR
===================================================== */

function selectMultiplier(value){

    multiplier = value;

    if(value === 2){

        alert("DOBLE seleccionado");

    }else{

        alert("TRIPLE seleccionado");

    }

}


/* =====================================================
   LANZAR DARDO
===================================================== */

function throwDart(base, label){

    let player =
        game.players[game.current];


    let points = base;


    /*
       Bull y doble Bull no utilizan
       el multiplicador.
    */

    if(base !== 25 && base !== 50){

        points = base * multiplier;

    }


    multiplier = 1;


    /*
       Reglas del 501:
       no puedes bajar de 0
       ni quedarte en 1.
    */

    if(
        points > player.score ||
        player.score - points === 1
    ){

        alert("Puntuación no válida.");

        return;

    }


    player.score -= points;

    player.darts++;

    player.pointsScored += points;

    game.turnDarts.push(label);

    game.turnPoints += points;


    if(player.score === 0){

        finishGame(player);

        return;

    }


    if(game.turnDarts.length >= 3){

        finishTurn();

        return;

    }


    renderGame();

}


/* =====================================================
   TERMINAR TURNO
===================================================== */

function finishTurn(){

    game.turnDarts = [];

    game.turnPoints = 0;

    multiplier = 1;


    game.current++;

    if(game.current >= game.players.length){

        game.current = 0;

    }


    let next =
        game.players[game.current];


    if(next.isBot){

        renderGame();

        setTimeout(botPlay,600);

    }else{

        renderGame();

    }

}


/* =====================================================
   JUGAR BOT
===================================================== */

function botPlay(){

    let bot =
        game.players[game.current];

    let darts = 0;


    function botDart(){

        if(darts >= 3){

            finishTurn();

            return;

        }


        let points;


        /*
           Cuanto mayor es el nivel,
           más probable es que consiga
           una puntuación alta.
        */

        let random =
            Math.random();


        if(bot.level >= 8 && random > 0.45){

            points =
                Math.floor(Math.random()*10)+11;

        }else if(bot.level >= 5 && random > 0.35){

            points =
                Math.floor(Math.random()*10)+6;

        }else{

            points =
                Math.floor(Math.random()*10)+1;

        }


        /*
           Intentar no pasarse.
        */

        if(points > bot.score){

            points = 0;

        }


        if(bot.score - points === 1){

            points = 0;

        }


        bot.score -= points;

        bot.darts++;

        bot.pointsScored += points;

        game.turnDarts.push(points);

        darts++;


        renderGame();


        if(bot.score === 0){

            finishGame(bot);

            return;

        }


        setTimeout(botDart,500);

    }


    botDart();

}


/* =====================================================
   TERMINAR PARTIDA
===================================================== */

function finishGame(winner){

    game.players.forEach(function(player){

        let user =
            data.users[player.name];


        if(!user){

            /*
               Los bots no necesitan
               cuenta permanente.
            */

            return;

        }


        user.totalPoints +=
            player.pointsScored;

        user.totalDarts +=
            player.darts;

        user.matches++;


        if(player.name === winner.name){

            user.wins++;

        }

    });


    saveData();


    document.getElementById("app").innerHTML = `

        <h1>🏆 ¡Partida terminada!</h1>

        <div class="card">

            <h2>
                ${escapeHTML(winner.name)}
                gana
            </h2>

            <p>
                ¡Enhorabuena!
            </p>

        </div>

        <button
            class="primary"
            onclick="showRanking()"
        >
            🏆 Ver ranking
        </button>

        <button onclick="showHome()">
            Inicio
        </button>

    `;

}


/* =====================================================
   MEDIA
===================================================== */

function getAverage(name){

    let user =
        data.users[name];


    if(
        !user ||
        user.totalDarts === 0
    ){

        return 0;

    }


    /*
       Media de 3 dardos.
    */

    return (
        user.totalPoints /
        user.totalDarts *
        3
    );

}


/* =====================================================
   RANKING
===================================================== */

function showRanking(){

    let players =
        Object.keys(data.users);


    players.sort(function(a,b){

        return getAverage(b) -
               getAverage(a);

    });


    let html = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>🏆 Ranking</h1>

        <div class="card">

    `;


    if(players.length === 0){

        html += `
            <p class="small">
                Todavía no hay jugadores.
            </p>
        `;

    }


    players.forEach(function(name,index){

        let user =
            data.users[name];


        html += `

            <div class="rank-row">

                <div>

                    <span class="rank-position">
                        ${index + 1}.
                    </span>

                    ${escapeHTML(name)}

                </div>

                <div class="rank-average">

                    ${getAverage(name).toFixed(2)}

                </div>

            </div>

        `;

    });


    html += `

        </div>

        <p class="small">
            La media es puntos por 3 dardos.
        </p>

    `;


    document.getElementById("app").innerHTML =
        html;

}


/* =====================================================
   MI CUENTA
===================================================== */

function showAccount(){

    let name =
        data.currentUser;


    let user =
        data.users[name];


    document.getElementById("app").innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>👤 Mi cuenta</h1>

        <div class="card">

            <h2>
                ${escapeHTML(name)}
            </h2>

            <div class="stat">

                <span>Media</span>

                <strong>
                    ${getAverage(name).toFixed(2)}
                </strong>

            </div>

            <div class="stat">

                <span>Partidas</span>

                <strong>
                    ${user.matches}
                </strong>

            </div>

            <div class="stat">

                <span>Victorias</span>

                <strong>
                    ${user.wins}
                </strong>

            </div>

            <div class="stat">

                <span>Dardos</span>

                <strong>
                    ${user.totalDarts}
                </strong>

            </div>

        </div>

    `;

}


/* =====================================================
   SALIR DE PARTIDA
===================================================== */

function leaveGame(){

    if(
        confirm(
            "¿Seguro que quieres salir de la partida?"
        )
    ){

        game = null;

        showHome();

    }

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

function logout(){

    data.currentUser = null;

    saveData();

    showLogin();

}


/* =====================================================
   INICIO
===================================================== */

if(data.currentUser){

    showHome();

}else{

    showLogin();

}

</script>

</body>
</html>
