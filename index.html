<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartsX 🎯</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0d1117;
    color:white;
    font-family:Arial,sans-serif;
}

#app{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    padding:20px;
}

h1{
    font-size:42px;
    margin:10px 0;
}

h2{
    margin-top:5px;
}

.card{
    background:#171d27;
    padding:20px;
    border-radius:20px;
    margin:15px 0;
}

input,select{
    width:100%;
    padding:14px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid #394352;
    background:#0d121a;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin:6px 0;
    border:0;
    border-radius:13px;
    background:#293241;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}

.primary{
    background:white;
    color:#111;
}

.danger{
    background:#713b43;
}

.back{
    background:transparent;
    text-align:left;
    width:auto;
}

.small{
    color:#9da8b8;
    font-size:14px;
}

.score{
    font-size:72px;
    text-align:center;
    font-weight:900;
    margin:20px 0;
}

.player{
    text-align:center;
    color:#aeb8c8;
    font-size:20px;
}

.dart-counter{
    text-align:center;
    color:#9da8b8;
}

.numbers{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}

.numbers button{
    margin:0;
    padding:13px 3px;
}

.bull{
    background:#56677e;
}

.special{
    background:#39485c;
}

.players-list{
    margin-top:10px;
}

.player-box{
    background:#202734;
    padding:13px;
    border-radius:12px;
    margin:7px 0;
}

.turn-darts{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.dart{
    background:#293241;
    padding:10px 15px;
    border-radius:10px;
}

.ranking-row{
    display:flex;
    justify-content:space-between;
    padding:14px 5px;
    border-bottom:1px solid #303846;
}

.stats{
    display:grid;
    gap:8px;
}

.stat{
    background:#202734;
    padding:15px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
}

.hidden{
    display:none;
}

.mode-button{
    padding:18px;
    font-size:18px;
}

.selected{
    outline:3px solid white;
}

.bot-level{
    display:flex;
    align-items:center;
    gap:8px;
}

.bot-level select{
    margin:0;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================================
   DATOS
===================================================== */

const STORAGE_KEY = "DARTSX_COMPLETO";

let data =
JSON.parse(localStorage.getItem(STORAGE_KEY))
||
{
    users:{},
    currentUser:null
};

let game = null;

let selectedBots = [];

let multiplier = 1;


/* =====================================================
   GUARDAR
===================================================== */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function safe(text){

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   PANTALLA LOGIN
===================================================== */

function showLogin(){

    app.innerHTML = `

        <h1>DartsX 🎯</h1>

        <p class="small">
            Marcador de dardos 501
        </p>

        <div class="card">

            <h2>🔐 Iniciar sesión</h2>

            <input
                id="loginName"
                placeholder="Nombre"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Contraseña"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Iniciar sesión
            </button>

        </div>

        <div class="card">

            <h2>📝 Registrarse</h2>

            <input
                id="registerName"
                placeholder="Crea tu nombre"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Crea tu contraseña"
            >

            <input
                id="registerPassword2"
                type="password"
                placeholder="Repite la contraseña"
            >

            <button onclick="register()">
                Crear cuenta
            </button>

        </div>

    `;

}


/* =====================================================
   REGISTRO
===================================================== */

function register(){

    let name =
    document.getElementById("registerName")
    .value
    .trim();

    let password =
    document.getElementById("registerPassword")
    .value;

    let password2 =
    document.getElementById("registerPassword2")
    .value;


    if(!name || !password){

        alert("Completa todos los campos.");

        return;

    }


    if(password !== password2){

        alert("Las contraseñas no coinciden.");

        return;

    }


    if(password.length < 4){

        alert(
            "La contraseña debe tener al menos 4 caracteres."
        );

        return;

    }


    if(data.users[name]){

        alert("Ese nombre ya está registrado.");

        return;

    }


    data.users[name] = {

        password:password,

        totalPoints:0,

        totalDarts:0,

        matches:0,

        wins:0

    };


    data.currentUser = name;

    save();

    showHome();

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    let name =
    document.getElementById("loginName")
    .value
    .trim();

    let password =
    document.getElementById("loginPassword")
    .value;


    if(!data.users[name]){

        alert("El usuario no existe.");

        return;

    }


    if(
        data.users[name].password !==
        password
    ){

        alert("Contraseña incorrecta.");

        return;

    }


    data.currentUser = name;

    save();

    showHome();

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

    let name = data.currentUser;


    app.innerHTML = `

        <h1>DartsX 🎯</h1>

        <p class="small">
            Bienvenido, ${safe(name)}
        </p>

        <button
            class="primary"
            onclick="showGameType()"
        >
            🎯 Nueva partida
        </button>

        <button onclick="showRanking()">
            🏆 Ranking
        </button>

        <button onclick="showAccount()">
            👤 Mi cuenta
        </button>

        <button
            class="danger"
            onclick="logout()"
        >
            Cerrar sesión
        </button>

    `;

}


/* =====================================================
   ELEGIR TIPO DE PARTIDA
===================================================== */

function showGameType(){

    app.innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>Nueva partida</h1>

        <div class="card">

            <h2>¿Contra quién quieres jugar?</h2>

            <button
                class="primary mode-button"
                onclick="setupBots()"
            >
                🤖 Contra bots
            </button>

            <button
                class="mode-button"
                onclick="setupFriend()"
            >
                👥 Contra un amigo
            </button>

        </div>

    `;

}


/* =====================================================
   CONFIGURAR BOTS
===================================================== */

function setupBots(){

    selectedBots = [];

    app.innerHTML = `

        <button
            class="back"
            onclick="showGameType()"
        >
            ← Volver
        </button>

        <h1>🤖 Bots</h1>

        <div class="card">

            <h2>Tu jugador</h2>

            <div class="player-box">
                👤 ${safe(data.currentUser)}
            </div>

        </div>

        <div class="card">

            <h2>Elige los bots</h2>

            <p class="small">
                Puedes añadir hasta 3 bots.
            </p>

            <button onclick="addBot()">
                + Añadir bot
            </button>

            <div id="bots"></div>

        </div>

        <button
            class="primary"
            onclick="startBotGame()"
        >
            🎯 Empezar partida
        </button>

    `;

    updateBots();

}


/* =====================================================
   AÑADIR BOT
===================================================== */

function addBot(){

    if(selectedBots.length >= 3){

        alert("Máximo 3 bots.");

        return;

    }


    selectedBots.push({

        level:1

    });


    updateBots();

}


/* =====================================================
   MOSTRAR BOTS
===================================================== */

function updateBots(){

    let container =
    document.getElementById("bots");


    if(!container) return;


    let html = "";


    selectedBots.forEach(
    function(bot,index){

        html += `

            <div class="player-box">

                <div class="bot-level">

                    <span>
                        🤖 Bot ${index+1}
                    </span>

                    <select
                        onchange="changeBotLevel(${index},this.value)"
                    >

                        ${createLevels(bot.level)}

                    </select>

                </div>

            </div>

        `;

    });


    container.innerHTML = html;

}


/* =====================================================
   NIVELES 1 - 10
===================================================== */

function createLevels(selected){

    let html = "";

    for(let i=1;i<=10;i++){

        html += `

            <option
                value="${i}"
                ${i == selected ? "selected":""}
            >
                Nivel ${i}
            </option>

        `;

    }

    return html;

}


/* =====================================================
   CAMBIAR NIVEL
===================================================== */

function changeBotLevel(index,value){

    selectedBots[index].level =
    Number(value);

}


/* =====================================================
   PARTIDA CONTRA BOTS
===================================================== */

function startBotGame(){

    let players = [];


    players.push({

        name:data.currentUser,

        score:501,

        darts:0,

        points:0,

        bot:false,

        level:10

    });


    selectedBots.forEach(
    function(bot,index){

        players.push({

            name:"Bot " + (index+1),

            score:501,

            darts:0,

            points:0,

            bot:true,

            level:bot.level

        });

    });


    startGame(players);

}


/* =====================================================
   CONTRA AMIGO
===================================================== */

function setupFriend(){

    app.innerHTML = `

        <button
            class="back"
            onclick="showGameType()"
        >
            ← Volver
        </button>

        <h1>👥 Contra un amigo</h1>

        <div class="card">

            <h2>Jugador 1</h2>

            <div class="player-box">
                👤 ${safe(data.currentUser)}
            </div>

            <h2>Jugador 2</h2>

            <input
                id="friendName"
                placeholder="Nombre de tu amigo"
            >

        </div>

        <button
            class="primary"
            onclick="startFriendGame()"
        >
            🎯 Empezar partida
        </button>

    `;

}


/* =====================================================
   EMPEZAR PARTIDA AMIGO
===================================================== */

function startFriendGame(){

    let friend =
    document.getElementById("friendName")
    .value
    .trim();


    if(!friend){

        alert("Escribe el nombre del segundo jugador.");

        return;

    }


    if(
        friend.toLowerCase() ===
        data.currentUser.toLowerCase()
    ){

        alert(
            "El segundo jugador debe tener otro nombre."
        );

        return;

    }


    /*
       Si el amigo no tiene cuenta,
       se crea una cuenta local para
       poder guardar sus estadísticas.
    */

    if(!data.users[friend]){

        data.users[friend] = {

            password:"",

            totalPoints:0,

            totalDarts:0,

            matches:0,

            wins:0

        };

    }


    save();


    let players = [

        {

            name:data.currentUser,

            score:501,

            darts:0,

            points:0,

            bot:false,

            level:10

        },

        {

            name:friend,

            score:501,

            darts:0,

            points:0,

            bot:false,

            level:10

        }

    ];


    startGame(players);

}


/* =====================================================
   CREAR PARTIDA
===================================================== */

function startGame(players){

    game = {

        players:players,

        current:0,

        turnDarts:[],

        turnPoints:0

    };


    multiplier = 1;

    renderGame();

}


/* =====================================================
   MOSTRAR PARTIDA
===================================================== */

function renderGame(){

    let player =
    game.players[game.current];


    app.innerHTML = `

        <div class="top">

            <button
                class="back"
                onclick="leaveGame()"
            >
                ← Salir
            </button>

            <span class="small">

                ${game.current+1}/${game.players.length}

            </span>

        </div>


        <div class="card">

            <div class="player">

                ${safe(player.name)}

            </div>

            <div class="score">

                ${player.score}

            </div>

            <div class="dart-counter">

                Dardos:
                ${game.turnDarts.length}/3

            </div>

        </div>


        <div class="card">

            <h3>Turno</h3>

            <div class="turn-darts">

                ${
                    game.turnDarts.length
                    ?

                    game.turnDarts.map(
                    function(d){

                        return `
                        <span class="dart">
                            ${safe(d)}
                        </span>
                        `;

                    }).join("")

                    :

                    "<span class='small'>Sin lanzamientos</span>"
                }

            </div>

        </div>


        <div class="card">

            <h3>🎯 Puntuación</h3>

            <div class="numbers">

                ${numberButtons()}

                <button
                    class="bull"
                    onclick="throwDart(25,'BULL 25')"
                >
                    BULL<br>25
                </button>

                <button
                    class="bull"
                    onclick="throwDart(50,'DOBLE BULL 50')"
                >
                    DOBLE BULL<br>50
                </button>

                <button
                    class="special"
                    onclick="selectMultiplier(2)"
                >
                    DOBLE
                </button>

                <button
                    class="special"
                    onclick="selectMultiplier(3)"
                >
                    TRIPLE
                </button>

                <button
                    onclick="throwDart(0,'MISS')"
                >
                    MISS
                </button>

            </div>

        </div>


        <button
            onclick="finishTurn()"
        >
            Terminar turno
        </button>

    `;

}


/* =====================================================
   BOTONES 1 - 20
===================================================== */

function numberButtons(){

    let html = "";


    for(let i=1;i<=20;i++){

        html += `

            <button
                onclick="throwDart(${i},'${i}')"
            >
                ${i}
            </button>

        `;

    }


    return html;

}


/* =====================================================
   MULTIPLICADOR
===================================================== */

function selectMultiplier(value){

    multiplier = value;


    if(value === 2){

        alert("🎯 DOBLE seleccionado");

    }else{

        alert("🎯 TRIPLE seleccionado");

    }

}


/* =====================================================
   LANZAR DARDO
===================================================== */

function throwDart(base,label){

    let player =
    game.players[game.current];


    let points = base;


    /*
       BULL y DOBLE BULL
       no utilizan el multiplicador.
    */

    if(
        base !== 25 &&
        base !== 50
    ){

        points =
        base * multiplier;

    }


    multiplier = 1;


    /*
       Reglas del 501.
    */

    if(
        points > player.score ||
        player.score - points === 1
    ){

        alert("❌ Puntuación no válida.");

        return;

    }


    player.score -= points;

    player.darts++;

    player.points += points;


    game.turnDarts.push(label);

    game.turnPoints += points;


    /*
       GANADOR
    */

    if(player.score === 0){

        finishGame(player);

        return;

    }


    /*
       TRES DARDOS
    */

    if(game.turnDarts.length >= 3){

        finishTurn();

        return;

    }


    renderGame();

}


/* =====================================================
   TERMINAR TURNO
===================================================== */

function finishTurn(){

    game.turnDarts = [];

    game.turnPoints = 0;

    multiplier = 1;


    game.current++;


    if(
        game.current >=
        game.players.length
    ){

        game.current = 0;

    }


    let next =
    game.players[game.current];


    renderGame();


    if(next.bot){

        setTimeout(botPlay,700);

    }

}


/* =====================================================
   BOT
===================================================== */

function botPlay(){

    let bot =
    game.players[game.current];


    let count = 0;


    function play(){

        if(count >= 3){

            finishTurn();

            return;

        }


        let points;


        /*
           Nivel del bot.

           Nivel 1 = peor
           Nivel 10 = mejor
        */

        let quality =
        bot.level / 10;


        let random =
        Math.random();


        if(
            random < quality
        ){

            points =
            Math.floor(
                Math.random()*15
            ) + 6;

        }else{

            points =
            Math.floor(
                Math.random()*10
            ) + 1;

        }


        /*
           Intentar cerrar.
        */

        if(
            bot.score <= 50 &&
            Math.random() < quality
        ){

            if(
                bot.score <= 20
            ){

                points =
                bot.score;

            }

        }


        /*
           No pasarse.
        */

        if(
            points > bot.score
        ){

            points = 0;

        }


        if(
            bot.score - points === 1
        ){

            points = 0;

        }


        bot.score -= points;

        bot.darts++;

        bot.points += points;


        game.turnDarts.push(points);


        count++;


        renderGame();


        if(bot.score === 0){

            finishGame(bot);

            return;

        }


        setTimeout(play,600);

    }


    play();

}


/* =====================================================
   TERMINAR PARTIDA
===================================================== */

function finishGame(winner){

    game.players.forEach(
    function(player){

        /*
           Solo guardamos estadísticas
           de jugadores con cuenta.
        */

        if(!data.users[player.name]){

            data.users[player.name] = {

                password:"",

                totalPoints:0,

                totalDarts:0,

                matches:0,

                wins:0

            };

        }


        let user =
        data.users[player.name];


        user.totalPoints +=
        player.points;


        user.totalDarts +=
        player.darts;


        user.matches++;


        if(
            player.name === winner.name
        ){

            user.wins++;

        }

    });


    save();


    app.innerHTML = `

        <h1>🏆 ¡Partida terminada!</h1>

        <div class="card">

            <h2>
                ${safe(winner.name)}
            </h2>

            <p>
                ¡Ha ganado la partida!
            </p>

        </div>


        <button
            class="primary"
            onclick="showRanking()"
        >
            🏆 Ver ranking
        </button>


        <button
            onclick="showHome()"
        >
            🏠 Volver al inicio
        </button>

    `;

}


/* =====================================================
   MEDIA
===================================================== */

function getAverage(name){

    let user =
    data.users[name];


    if(
        !user ||
        user.totalDarts === 0
    ){

        return 0;

    }


    return (
        user.totalPoints /
        user.totalDarts
    ) * 3;

}


/* =====================================================
   RANKING
===================================================== */

function showRanking(){

    let players =
    Object.keys(data.users);


    players.sort(
    function(a,b){

        return (
            getAverage(b) -
            getAverage(a)
        );

    });


    let html = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>🏆 Ranking</h1>

        <div class="card">

    `;


    if(players.length === 0){

        html += `
            <p class="small">
                Todavía no hay jugadores.
            </p>
        `;

    }


    players.forEach(
    function(name,index){

        html += `

            <div class="ranking-row">

                <span>

                    ${index+1}.
                    ${safe(name)}

                </span>

                <strong>

                    ${getAverage(name).toFixed(2)}

                </strong>

            </div>

        `;

    });


    html += `

        </div>

        <p class="small">
            Ranking ordenado por media de 3 dardos.
        </p>

    `;


    app.innerHTML = html;

}


/* =====================================================
   MI CUENTA
===================================================== */

function showAccount(){

    let name =
    data.currentUser;


    let user =
    data.users[name];


    app.innerHTML = `

        <button
            class="back"
            onclick="showHome()"
        >
            ← Volver
        </button>

        <h1>👤 Mi cuenta</h1>

        <div class="card">

            <h2>
                ${safe(name)}
            </h2>

            <div class="stats">

                <div class="stat">

                    <span>Media</span>

                    <strong>
                        ${getAverage(name).toFixed(2)}
                    </strong>

                </div>


                <div class="stat">

                    <span>Partidas</span>

                    <strong>
                        ${user.matches}
                    </strong>

                </div>


                <div class="stat">

                    <span>Victorias</span>

                    <strong>
                        ${user.wins}
                    </strong>

                </div>


                <div class="stat">

                    <span>Dardos</span>

                    <strong>
                        ${user.totalDarts}
                    </strong>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   SALIR DE PARTIDA
===================================================== */

function leaveGame(){

    if(
        confirm(
            "¿Quieres salir de la partida?"
        )
    ){

        game = null;

        showHome();

    }

}


/* =====================================================
   CERRAR SESIÓN
===================================================== */

function logout(){

    data.currentUser = null;

    save();

    showLogin();

}


/* =====================================================
   INICIO
===================================================== */

if(data.currentUser){

    showHome();

}else{

    showLogin();

}

</script>

</body>
</html>
