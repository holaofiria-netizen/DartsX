<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartsX</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#111;color:white}
.screen{display:none;min-height:100vh;padding:20px}
.active{display:block}
.card{max-width:500px;margin:30px auto;background:#1d1d1d;padding:25px;border-radius:18px}
h1,h2,h3{text-align:center}
.logo{text-align:center;font-size:48px;font-weight:bold;margin:20px}
input{width:100%;padding:14px;margin:7px 0;border:0;border-radius:10px;background:#303030;color:white;font-size:16px}
button{cursor:pointer}
.main,.secondary,.pass{width:100%;padding:15px;margin-top:10px;border:0;border-radius:10px;font-size:18px;font-weight:bold}
.main,.pass{background:#e63946;color:white}
.secondary{background:#333;color:white;font-size:16px}
.message{text-align:center;min-height:25px;margin:10px}
.error{color:#ff5555}
.success{color:#55dd77}
.bot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bot{padding:18px 5px;border:0;border-radius:12px;background:#292929;color:white;font-size:17px}
.bot.selected{background:#e63946}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.player-box{background:#202020;border-radius:15px;padding:15px;text-align:center}
.player-box.active-player{border:3px solid #e63946}
.score{font-size:55px;font-weight:bold;margin:10px}
.average{color:#aaa}
.turn-info{text-align:center;margin:15px;font-size:20px}
.dart-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.dart-grid button{padding:13px 3px;border:0;border-radius:8px;background:#333;color:white;font-size:14px}
.double{background:#126b45!important}
.triple{background:#7c2424!important}
.bull{background:#795000!important}
.turn-darts{text-align:center;margin:15px;font-size:18px}
.checkout{background:#172d1f;padding:12px;border-radius:10px;margin-top:10px;text-align:center}
.hidden{display:none!important}
.stats{background:#222;padding:15px;margin:10px 0;border-radius:10px}
.ranking-item{padding:12px;border-bottom:1px solid #444}
@media(max-width:500px){
.score{font-size:40px}
.dart-grid button{font-size:12px;padding:12px 2px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
<div class="card">

<div class="logo">🎯 DartsX</div>
<h2>Iniciar sesión</h2>

<input id="loginUser" placeholder="Usuario">
<input id="loginPass" type="password" placeholder="Contraseña">

<button class="main" onclick="login()">INICIAR SESIÓN</button>
<button class="secondary" onclick="showScreen('registerScreen')">REGISTRARSE</button>

<div id="loginMessage" class="message"></div>

</div>
</div>

<!-- REGISTRO -->
<div id="registerScreen" class="screen">
<div class="card">

<div class="logo">🎯 DartsX</div>
<h2>Crear cuenta</h2>

<input id="registerUser" placeholder="Nombre de usuario">
<input id="registerPass" type="password" placeholder="Contraseña">
<input id="registerPass2" type="password" placeholder="Repetir contraseña">

<button class="main" onclick="register()">CREAR CUENTA</button>
<button class="secondary" onclick="showScreen('loginScreen')">VOLVER</button>

<div id="registerMessage" class="message"></div>

</div>
</div>

<!-- MENU -->
<div id="menuScreen" class="screen">
<div class="card">

<div class="logo">🎯 DartsX</div>

<h2>Hola, <span id="menuUsername"></span></h2>

<button class="main" onclick="showBotSelection()">🎯 PARTIDA</button>
<button class="main" onclick="showAccount()">👤 MI CUENTA</button>
<button class="secondary" onclick="logout()">CERRAR SESIÓN</button>

</div>
</div>

<!-- BOTS -->
<div id="botScreen" class="screen">
<div class="card">

<h1>Elige tu rival</h1>

<div class="bot-grid" id="botGrid"></div>

<button class="main" onclick="startGame()">EMPEZAR PARTIDA</button>
<button class="secondary" onclick="showScreen('menuScreen')">VOLVER</button>

</div>
</div>

<!-- PARTIDA -->
<div id="gameScreen" class="screen">
<div class="game-board">

<h1>🎯 DartsX</h1>

<div class="turn-info">
<b id="roundText">Ronda 1</b><br>
<span id="turnText">Tu turno</span>
</div>

<div class="scores">

<div id="playerBox" class="player-box active-player">
<h3 id="playerName">Jugador</h3>
<div id="playerScoreDisplay" class="score">501</div>
<div class="average">Media: <span id="playerAverage">0.00</span></div>
</div>

<div id="botBox" class="player-box">
<h3 id="botName">Bot</h3>
<div id="botScoreDisplay" class="score">501</div>
<div class="average">Media: <span id="botAverage">0.00</span></div>
</div>

</div>

<div class="turn-darts">
<span id="dartCounter">Dardos: 0 / 3</span><br>
<span id="turnScoreText">Puntos de ronda: 0</span>
</div>

<div id="checkoutBox" class="checkout hidden"></div>

<h3>Simple</h3>
<div class="dart-grid" id="singleButtons"></div>

<h3>Doble</h3>
<div class="dart-grid" id="doubleButtons"></div>

<h3>Triple</h3>
<div class="dart-grid" id="tripleButtons"></div>

<h3>Bull</h3>

<div class="dart-grid">

<button class="bull" onclick="throwDart(25,'SBull')">
SBull<br>25
</button>

<button class="bull" onclick="throwDart(50,'DBull')">
DBull<br>50
</button>

</div>

<button id="passButton" class="pass hidden" onclick="passRound()">
PASAR DE RONDA
</button>

<button class="secondary" onclick="confirmExitGame()">
SALIR DE PARTIDA
</button>

<div id="gameMessage" class="message"></div>

</div>
</div>

<!-- CUENTA -->
<div id="accountScreen" class="screen">
<div class="card">

<h1>👤 Mi cuenta</h1>

<div class="stats">
<b>Usuario:</b> <span id="accountUsername"></span>
</div>

<div class="stats">
<b>Partidas jugadas:</b> <span id="gamesPlayed"></span>
</div>

<div class="stats">
<b>Victorias:</b> <span id="victories"></span>
</div>

<div class="stats">
<b>Derrotas:</b> <span id="defeats"></span>
</div>

<div class="stats">
<b>Media:</b> <span id="accountAverage"></span>
</div>

<h2>🏆 Ranking</h2>

<div id="ranking"></div>

<button class="secondary" onclick="showScreen('menuScreen')">
VOLVER
</button>

</div>
</div>

<script>

/* =========================
   VARIABLES
========================= */

const botLevels={
1:20,
2:30,
3:45,
4:50,
5:65,
6:70,
7:75,
8:80,
9:90,
10:120
};

let currentUser=null;
let selectedBot=1;

let playerScore=501;
let botScore=501;

let round=1;
let turn="player";

let turnScore=0;
let turnDarts=0;

let playerTotalPoints=0;
let playerTotalDarts=0;

let botTotalPoints=0;
let botTotalDarts=0;

let gameFinished=false;

/* =========================
   PANTALLAS
========================= */

function showScreen(id){

document.querySelectorAll(".screen").forEach(s=>{
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

/* =========================
   USUARIOS
========================= */

function getUsers(){
return JSON.parse(localStorage.getItem("dartsX_users")||"{}");
}

function saveUsers(users){
localStorage.setItem("dartsX_users",JSON.stringify(users));
}

function register(){

const username=document.getElementById("registerUser").value.trim();
const password=document.getElementById("registerPass").value;
const password2=document.getElementById("registerPass2").value;

const message=document.getElementById("registerMessage");

if(!username||!password){

message.textContent="Rellena todos los campos.";
message.className="message error";
return;

}

if(password!==password2){

message.textContent="Las contraseñas no coinciden.";
message.className="message error";
return;

}

const users=getUsers();

if(users[username]){

message.textContent="Ese usuario ya existe.";
message.className="message error";
return;

}

users[username]={
password:password,
games:0,
wins:0,
losses:0,
totalPoints:0,
totalDarts:0
};

saveUsers(users);

message.textContent="Cuenta creada correctamente.";
message.className="message success";

setTimeout(()=>{
showScreen("loginScreen");
},700);

}

function login(){

const username=document.getElementById("loginUser").value.trim();
const password=document.getElementById("loginPass").value;

const users=getUsers();

if(!users[username]||users[username].password!==password){

document.getElementById("loginMessage").textContent=
"Usuario o contraseña incorrectos.";

document.getElementById("loginMessage").className=
"message error";

return;

}

currentUser=username;

localStorage.setItem("dartsX_currentUser",username);

document.getElementById("menuUsername").textContent=username;

showScreen("menuScreen");

}

function logout(){

currentUser=null;

localStorage.removeItem("dartsX_currentUser");

showScreen("loginScreen");

}

/* =========================
   SELECCIONAR BOT
========================= */

function showBotSelection(){

const grid=document.getElementById("botGrid");

grid.innerHTML="";

for(let i=1;i<=10;i++){

const button=document.createElement("button");

button.className="bot";

button.innerHTML=
"BOT NIVEL "+i+
"<br>Media: "+botLevels[i];

button.onclick=()=>{

selectedBot=i;

document.querySelectorAll(".bot").forEach(b=>{
b.classList.remove("selected");
});

button.classList.add("selected");

};

grid.appendChild(button);

}

showScreen("botScreen");

}

/* =========================
   INICIAR PARTIDA
========================= */

function startGame(){

playerScore=501;
botScore=501;

round=1;
turn="player";

turnScore=0;
turnDarts=0;

playerTotalPoints=0;
playerTotalDarts=0;

botTotalPoints=0;
botTotalDarts=0;

gameFinished=false;

document.getElementById("playerName").textContent=currentUser;

document.getElementById("botName").textContent=
"Bot nivel "+selectedBot;

document.getElementById("passButton").classList.add("hidden");

updateGameScreen();

showScreen("gameScreen");

}

/* =========================
   BOTONES
========================= */

function createDartButtons(){

const single=document.getElementById("singleButtons");
const doubles=document.getElementById("doubleButtons");
const triples=document.getElementById("tripleButtons");

single.innerHTML="";
doubles.innerHTML="";
triples.innerHTML="";

for(let i=1;i<=20;i++){

let s=document.createElement("button");

s.textContent="S"+i;

s.onclick=()=>throwDart(i,"S"+i);

single.appendChild(s);


let d=document.createElement("button");

d.className="double";

d.textContent="D"+i;

d.onclick=()=>throwDart(i*2,"D"+i);

doubles.appendChild(d);


let t=document.createElement("button");

t.className="triple";

t.textContent="T"+i;

t.onclick=()=>throwDart(i*3,"T"+i);

triples.appendChild(t);

}

}

/* =========================
   LANZAR DARTO
========================= */

function throwDart(points,name){

if(gameFinished)return;

if(turn!=="player")return;

if(turnDarts>=3)return;


/*
IMPORTANTE:

Aquí NO se bloquea el mismo botón.

Puedes pulsar:

T20
T20
T20

o:

D20
D20
D20

etc.

Cada pulsación cuenta como un dardo.
*/

const remaining=playerScore-turnScore-points;


/* BUST */

if(remaining<0){

turnDarts=3;

showGameMessage("BUST — ronda perdida.");

document.getElementById("passButton")
.classList.remove("hidden");

updateGameScreen();

return;

}


/*
Si llega a 0 necesita doble.
*/

if(remaining===0){

const isDouble=
name.startsWith("D")||
name==="DBull";

if(!isDouble){

showGameMessage(
"Necesitas terminar con un doble o doble Bull."
);

return;

}

turnScore+=points;

turnDarts++;

playerTotalPoints+=points;

playerTotalDarts++;

playerScore=0;

finishGame(true);

return;

}


/*
Dardo normal.

Cada pulsación aumenta el contador.
*/

turnScore+=points;

turnDarts++;

playerTotalPoints+=points;

playerTotalDarts++;


updateGameScreen();


/*
Después del tercer dardo
*/

if(turnDarts===3){

document.getElementById("passButton")
.classList.remove("hidden");

}

}

/* =========================
   PASAR RONDA
========================= */

function passRound(){

if(gameFinished)return;

if(turn!=="player")return;


/*
Aplicamos los puntos de los 3 dardos.
*/

playerScore-=turnScore;


/*
Si hubo BUST no aplicamos los puntos.
*/

if(playerScore<0){

playerScore+=turnScore;

}


/*
Siguiente turno.
*/

turnScore=0;
turnDarts=0;

document.getElementById("passButton")
.classList.add("hidden");

turn="bot";

updateGameScreen();

setTimeout(botTurn,700);

}

/* =========================
   TURNO BOT
========================= */

function botTurn(){

if(gameFinished)return;

turn="bot";

const average=botLevels[selectedBot];

let botRoundScore=0;


/*
El bot lanza 3 dardos.

La media del bot aumenta según el nivel.
*/

for(let i=0;i<3;i++){

let dart;

const chance=Math.random();

if(chance<0.55){

dart=Math.round(
(average/3)*
(0.65+Math.random()*0.7)
);

}else{

dart=Math.round(
(average/3)*
(0.3+Math.random()*1.2)
);

}

dart=Math.max(1,dart);

dart=Math.min(60,dart);


/*
No dejamos que el bot se pase.
*/

if(botScore-botRoundScore-dart<0){

continue;

}

botRoundScore+=dart;

botTotalPoints+=dart;

botTotalDarts++;


/*
Si llega a 0.
*/

if(botScore-botRoundScore===0){

break;

}

}


/*
Aplicamos la ronda del bot.
*/

botScore-=botRoundScore;

updateGameScreen();


if(botScore<=0){

finishGame(false);

return;

}


setTimeout(()=>{

round++;

turn="player";

turnScore=0;
turnDarts=0;

document.getElementById("passButton")
.classList.add("hidden");

updateGameScreen();

},900);

}

/* =========================
   ACTUALIZAR MARCADOR
========================= */

function updateGameScreen(){

/*
El marcador muestra lo que queda
después de los dardos de la ronda.
*/

document.getElementById("playerScoreDisplay")
.textContent=
Math.max(0,playerScore-turnScore);

document.getElementById("botScoreDisplay")
.textContent=botScore;

document.getElementById("roundText")
.textContent="Ronda "+round;

document.getElementById("turnText")
.textContent=
turn==="player"?"Tu turno":"Turno del bot";

document.getElementById("dartCounter")
.textContent=
"Dardos: "+turnDarts+" / 3";

document.getElementById("turnScoreText")
.textContent=
"Puntos de ronda: "+turnScore;


const playerAverage=
playerTotalDarts>0
?playerTotalPoints/playerTotalDarts*3
:0;

const botAverage=
botTotalDarts>0
?botTotalPoints/botTotalDarts*3
:0;

document.getElementById("playerAverage")
.textContent=playerAverage.toFixed(2);

document.getElementById("botAverage")
.textContent=botAverage.toFixed(2);

document.getElementById("playerBox")
.classList.toggle(
"active-player",
turn==="player"
);

document.getElementById("botBox")
.classList.toggle(
"active-player",
turn==="bot"
);

showCheckout();

}

/* =========================
   CHECKOUT
========================= */

function showCheckout(){

const box=document.getElementById("checkoutBox");

let score=playerScore-turnScore;

box.classList.add("hidden");

const checkouts={

170:"T20 T20 Bull",
167:"T20 T19 Bull",
164:"T20 T18 Bull",
161:"T20 T17 Bull",

160:"T20 T20 D20",
158:"T20 T20 D19",
157:"T20 T19 D20",
156:"T20 T20 D18",
155:"T20 T19 D19",
154:"T20 T18 D20",
153:"T20 T19 D18",
152:"T20 T20 D16",
151:"T20 T17 D20",
150:"T20 T18 D18",

140:"T20 T20 D10",
130:"T20 T18 D8",
120:"T20 T20 D20",
110:"T20 T18 D10",
100:"T20 D20",
90:"T20 D15",
80:"T20 D10",
70:"T18 D8",
60:"S20 D20",
50:"Bull",
40:"D20",
32:"D16",
24:"D12",
20:"D10",
16:"D8",
12:"D6",
10:"D5",
8:"D4",
6:"D3",
4:"D2",
2:"D1"

};

if(checkouts[score]){

box.textContent=
"💡 Checkout: "+checkouts[score];

box.classList.remove("hidden");

}

}

/* =========================
   MENSAJES
========================= */

function showGameMessage(message){

const element=document.getElementById("gameMessage");

element.textContent=message;

setTimeout(()=>{
element.textContent="";
},2500);

}

/* =========================
   FINAL PARTIDA
========================= */

function finishGame(playerWon){

gameFinished=true;

const users=getUsers();

const user=users[currentUser];

user.games++;

if(playerWon){
user.wins++;
}else{
user.losses++;
}

user.totalPoints+=playerTotalPoints;
user.totalDarts+=playerTotalDarts;

saveUsers(users);

showGameMessage(
playerWon
?"🏆 ¡HAS GANADO!"
:"🤖 HA GANADO EL BOT"
);

setTimeout(()=>{

if(confirm(
playerWon
?"¡Has ganado! ¿Volver al menú?"
:"Has perdido. ¿Volver al menú?"
)){

showScreen("menuScreen");

}else{

showAccount();

}

},1200);

}

/* =========================
   CUENTA
========================= */

function showAccount(){

const users=getUsers();

const user=users[currentUser];

document.getElementById("accountUsername")
.textContent=currentUser;

document.getElementById("gamesPlayed")
.textContent=user.games;

document.getElementById("victories")
.textContent=user.wins;

document.getElementById("defeats")
.textContent=user.losses;

const average=
user.totalDarts>0
?user.totalPoints/user.totalDarts*3
:0;

document.getElementById("accountAverage")
.textContent=average.toFixed(2);

createRanking();

showScreen("accountScreen");

}

/* =========================
   RANKING
========================= */

function createRanking(){

const users=getUsers();

const ranking=Object.entries(users)
.map(([name,data])=>{

const average=
data.totalDarts>0
?data.totalPoints/data.totalDarts*3
:0;

return{
name:name,
average:average
};

})
.sort((a,b)=>b.average-a.average);


const container=document.getElementById("ranking");

container.innerHTML="";

ranking.forEach((player,index)=>{

const div=document.createElement("div");

div.className="ranking-item";

div.innerHTML=
"<b>#"+(index+1)+" "+
player.name+
"</b> — Media: "+
player.average.toFixed(2);

container.appendChild(div);

});

}

/* =========================
   SALIR
========================= */

function confirmExitGame(){

if(confirm("¿Seguro que quieres salir de la partida?")){

gameFinished=true;

showScreen("menuScreen");

}

}

/* =========================
   INICIO
========================= */

createDartButtons();

const savedUser=
localStorage.getItem("dartsX_currentUser");

if(savedUser){

const users=getUsers();

if(users[savedUser]){

currentUser=savedUser;

document.getElementById("menuUsername")
.textContent=savedUser;

showScreen("menuScreen");

}

}

</script>

</body>
</html>
